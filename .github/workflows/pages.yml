name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          # Valores públicos do Supabase (Settings › Variables do repositório). Sem eles, o site abre só a demonstração.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Com domínio próprio (ex.: financeiro.witchmymac.com) o app fica na raiz; senão em /<repositório>.
          if [ -n "$CUSTOM_DOMAIN" ]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
          npm run build
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > build/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
